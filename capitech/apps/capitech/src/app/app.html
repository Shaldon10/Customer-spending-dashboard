<div class="app-shell" [class.sidebar-hidden]="sidebarHidden()" [class.login-mode]="isLoginPage()">
	<aside
		class="sidebar"
		id="main-navigation"
		aria-label="Main navigation"
		[attr.inert]="sidebarHidden() ? '' : null"
	>
		<a class="brand" routerLink="/" aria-label="Capitech Insights home">
			<span class="brand-mark" aria-hidden="true">C</span>
			<span>
				<span class="brand-name">Capitech</span>
				<span class="brand-caption">INSIGHTS</span>
			</span>
		</a>

		<p class="nav-label">Workspace</p>
		<nav class="nav">
			<a class="nav-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Overview</a>
			<a class="nav-item" routerLink="/transactions" routerLinkActive="active" ariaCurrentWhenActive="page">Transactions</a>
			<a class="nav-item" routerLink="/spending-analysis" routerLinkActive="active" ariaCurrentWhenActive="page">Spending analysis</a>
			<a class="nav-item" routerLink="/budget-goals" routerLinkActive="active" ariaCurrentWhenActive="page">Budget goals</a>
		</nav>

		<button class="account" type="button" routerLink="/customer-profile" aria-describedby="account-tooltip">
			<span class="avatar" aria-hidden="true">{{ initials() }}</span>
			<span class="account-copy">
				<strong>{{ profile()?.name ?? (loading() ? 'Loading profile' : 'Profile unavailable') }}</strong>
				<small>{{ profileId() }}</small>
			</span>
			<span class="account-tooltip" id="account-tooltip" role="tooltip">
				<span>Total spent</span>
				<strong>{{ totalSpent() }}</strong>
			</span>
		</button>
		<button class="logout-button" type="button" (click)="logout()">Sign out</button>
	</aside>

	<main class="page-content">
		<div class="menu-controls">
			<button
				class="menu-toggle"
				type="button"
				(click)="toggleSidebar()"
				[attr.aria-expanded]="!sidebarHidden()"
				[attr.aria-label]="sidebarHidden() ? 'Show menu' : 'Hide menu'"
				[attr.title]="sidebarHidden() ? 'Show menu' : 'Hide menu'"
				aria-controls="main-navigation"
			>
				<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
					<path d="M4 6h16M4 12h16M4 18h16"></path>
				</svg>
			</button>
		</div>
		<router-outlet></router-outlet>
	</main>
</div>
